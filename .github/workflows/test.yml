name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install production simulation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice poppler-utils
      - run: bun install --frozen-lockfile
      - run: bun run check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Prepare local-only Compose environment
        run: touch .env
      - run: bun run build
      - run: bun run test:docker
